name: Credit Payment Generator
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: Notion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_CUENTAS_ID: ${{ secrets.DB_CUENTAS_ID }}
          DB_PRESUPUESTO_ID: ${{ secrets.DB_PRESUPUESTO_ID }}
          PAGO_TEMPLATE_ID: ${{ secrets.PAGO_TEMPLATE_ID }}
          PAGO_DEUDAS_ID: ${{ secrets.PAGO_DEUDAS_ID }}
        run: python credit_payment.py
