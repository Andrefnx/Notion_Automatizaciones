name: Credit Payment Generator
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: Notion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run reviewed legacy automation
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_CUENTAS_ID: ${{ secrets.DB_CUENTAS_ID }}
          DB_PRESUPUESTO_ID: ${{ secrets.DB_PRESUPUESTO_ID }}
          CUOTAS_TEMPLATE_ID: ${{ secrets.CUOTAS_TEMPLATE_ID }}
          PAGO_DEUDAS_ID: ${{ secrets.PAGO_DEUDAS_ID }}
        run: python credit_payment.py
